# Publish on a version tag.
#
# Does nothing until a tag matching `v*` is pushed, so it is safe to sit here
# unused. `node scripts/bump-version.mjs <version>` makes the bump (every package, the pins, the lockfile, the
# changelog); the tag is pushed on the merged commit on main, and that is what starts it.
#
# The shape of this file is the whole safety argument, so it is worth stating:
#
#   preflight ──► ci-green ──► npm (irreversible)
#
#   1. preflight is cheap and runs first, so the mistakes that are common and
#      permanent — a tag that does not match package.json, a version already on
#      npm, a build that drops a file from the tarball — fail in seconds rather
#      than after a twenty-minute browser suite has run and half-published.
#   2. npm publish is the one irreversible step, so it waits for a green CI run
#      on this very commit (unit suite against real Postgres, browser
#      suite, Web Vitals). The check is on the SHA, so "it passed earlier" is
#      only accepted when earlier was this commit.
#
# This repository publishes the six framework packages and no container image:
# an App ships its own (`mistri build --dockerfile`), and the database
# browser's image is built in its own repository
# (https://github.com/rbaljinder/tablewalk).
name: Release

on:
  push:
    tags: ['v*']

# One release at a time, and never cancelled mid-flight: interrupting the publish between two packages is a
# half-release (which running the job again finishes: scripts/publish-packages.mjs skips what is already live).
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Cheap, and first. Everything else waits on it.
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm

      - name: The tag matches every package's version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          # The workspace root and each package under packages/ carry the one
          # version; the packages depend on each other at exactly it.
          for manifest in package.json packages/*/package.json; do
            pkg="$(node -p "require('./$manifest').version")"
            if [ "$tag" != "$pkg" ]; then
              echo "::error::tag v$tag does not match $manifest $pkg — bump one to match the other" >&2
              exit 1
            fi
          done
          echo "releasing $tag"

      - name: This version is not already all on npm
        run: |
          # A version is permanent, so a release whose every package is live has nothing to publish: bump it. One that
          # is only partly live is a publish that stopped halfway, and running the job again finishes it, so that is
          # a warning (scripts/publish-packages.mjs, which asks `npm view` for each package).
          node scripts/publish-packages.mjs --check

      - run: npm ci

      - name: The tarballs have what they need and nothing they should not
        run: |
          # A pack builds nothing (each package's prepack refuses a missing
          # dist/), so the build runs first — the one a release publishes.
          npm run build
          npm pack --workspaces --dry-run --json > /tmp/pack.json
          # The same check CI's package job runs on every change, so the list cannot go stale between releases.
          node scripts/check-tarballs.mjs /tmp/pack.json

  # The release does not re-run the suites: it requires that CI already passed
  # on this exact commit. Re-running the same shards on the tag spent another
  # half hour of runners to learn what ci.yml had just said, and a second run
  # could disagree with the first only by flaking, which is not evidence about
  # the code. A tag points at one commit; the CI run for that commit (a push to
  # main, or the pull request's head, which is the same SHA under a
  # fast-forward or a rebased merge) is the record that it was green. The
  # unit suite, the browser suite, the live databases and Web Vitals all gate
  # ci.yml, so there is nothing here that a green run has not already proved.
  # No run, a running one, or a failed one stops the release: re-run CI on the
  # commit, or tag the commit CI ran on.
  ci-green:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    steps:
      - name: CI succeeded on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          runs="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${GITHUB_SHA}&per_page=100" \
            --jq '[.workflow_runs[] | {id, event, status, conclusion}]')"
          echo "$runs"
          ok="$(echo "$runs" | jq '[.[] | select(.status == "completed" and .conclusion == "success")] | length')"
          if [ "$ok" -lt 1 ]; then
            echo "::error::no successful CI run for ${GITHUB_SHA} — let CI pass on this commit (or re-run it), then re-push the tag" >&2
            exit 1
          fi
          echo "CI passed on ${GITHUB_SHA} ($ok run)"

  # The irreversible step, gated on CI having passed this commit.
  npm:
    needs: [ci-green]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for npm trusted publishing over OIDC — this is what lets
      # `npm publish` authenticate without a stored token.
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run build
      # Trusted publishing over OIDC: no token, because `id-token: write` above
      # lets npm authenticate to the registry directly, and no `--provenance`
      # flag, because OIDC generates and publishes the provenance attestation
      # automatically. The one prerequisite is on npm's side — a trusted
      # publisher configured for this package naming this repo and this
      # workflow file (release.yml). Until that exists, this step fails with an
      # auth error rather than publishing — for each of the six packages (create-mistri
      # and @mistriwork/cloudflare among them: each trusted publisher is configured separately).
      #
      # Every package, one at a time, in dependency order (engine, ui, kit,
      # mistri, create-mistri, cloudflare): a package depends on those before
      # it at exactly this version (mistri on engine, kit and ui; create-mistri
      # on mistri), so publishing one alone installs nothing. `npm publish
      # --workspaces` is not atomic, so a failure after the second package left
      # a release the next run refused; the script skips any name@version the
      # registry already has, and running this job again publishes the rest.
      #
      # A prerelease (1.0.0-rc.2) goes out under `next`, never `latest`: npm refuses one without a --tag, and the
      # script says it.
      - run: node scripts/publish-packages.mjs
