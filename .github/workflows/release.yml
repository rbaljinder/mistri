# Publish on a version tag.
#
# Does nothing until a tag matching `v*` is pushed, so it is safe to sit here
# unused. `npm version patch && git push --follow-tags` is what starts it.
#
# The shape of this file is the whole safety argument, so it is worth stating:
#
#   preflight ──► ci-green ──► npm (irreversible) ──► image
#
#   1. preflight is cheap and runs first, so the mistakes that are common and
#      permanent — a tag that does not match package.json, a version already on
#      npm, a build that drops a file from the tarball — fail in seconds rather
#      than after a twenty-minute browser suite has run and half-published.
#   2. npm publish is the one irreversible step, so it waits for a green CI run
#      on this very commit (unit suite against real Postgres, browser
#      suite, Web Vitals). The check is on the SHA, so "it passed earlier" is
#      only accepted when earlier was this commit.
#   3. the image is built and pushed only *after* npm has published, so a
#      failure there can never leave an image at a version npm does not have.
#      A stale Dockerfile is already caught on every push to main by ci.yml, so
#      this ordering costs nothing in practice and removes the half-release.
name: Release

on:
  push:
    tags: ['v*']

# One release at a time, and never cancelled mid-flight: interrupting a job
# between `npm publish` and `docker push` is exactly the half-release the
# ordering above exists to avoid.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Cheap, and first. Everything else waits on it.
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm

      - name: The tag matches every package's version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          # The workspace root and each package under packages/ carry the one
          # version; the packages depend on each other at exactly it.
          for manifest in package.json packages/*/package.json; do
            pkg="$(node -p "require('./$manifest').version")"
            if [ "$tag" != "$pkg" ]; then
              echo "::error::tag v$tag does not match $manifest $pkg — bump one to match the other" >&2
              exit 1
            fi
          done
          echo "releasing $tag"

      - name: This version is not already on npm
        run: |
          # Every package is published at the release's version, so none of
          # them may have it already.
          for manifest in packages/*/package.json; do
            name="$(node -p "require('./$manifest').name")"
            ver="$(node -p "require('./$manifest').version")"
            code="$(curl -fsS -o /dev/null -w '%{http_code}' "https://registry.npmjs.org/$name/$ver" || true)"
            if [ "$code" = "200" ]; then
              echo "::error::$name@$ver is already published — a version is permanent, so bump it" >&2
              exit 1
            fi
            echo "$name@$ver is unpublished (registry said $code)"
          done

      - run: npm ci

      - name: The tarballs have what they need and nothing they should not
        run: |
          # A pack builds nothing (each package's prepack refuses a missing
          # dist/), so the build runs first — the one a release publishes.
          npm run build
          npm pack --workspaces --dry-run --json > /tmp/pack.json
          node -e '
            const packs = Object.fromEntries(require("/tmp/pack.json").map(p => [p.name, p.files.map(f => f.path)]));
            // The client entry is named for its content, so it is found the way a
            // browser finds it: by the module script index.html names. Its compressed
            // copies are what the server sends, and its map is what a trace reads.
            // Each product builds its own client (config/vite.tablewalk.config.ts, config/vite.mistri.config.ts).
            const client = (product) => {
              const html = require("fs").readFileSync(`packages/${product}/dist/client/index.html`, "utf8");
              const entry = /<script type="module"[^>]*\ssrc="\/(assets\/[^"]+\.js)"/.exec(html)?.[1];
              if (!entry) { console.error(`::error::${product}'s dist/client/index.html names no module entry under assets/`); process.exit(1); }
              return ["index.html", "index.html.br", "index.html.gz", entry, entry + ".br", entry + ".gz", entry + ".map"].map(p => "dist/client/" + p);
            };
            const common = ["package.json", "README.md", "LICENSE"];
            // `schema/` is in mistri's exports map (`@mistriwork/mistri/app`, the JSON schemas): a
            // tarball without it installs and then fails at the first import.
            const need = {
              "@mistriwork/engine": [...common, "dist/server/connections.js"],
              "@mistriwork/kit": [...common, "dist/clientFiles.js"],
              "@mistriwork/mistri": [...common, ...client("mistri"), "dist/server/index.js", "dist/server/app/apps.js", "schema/app.d.ts", "schema/app.mjs", "schema/app.schema.json", "schema/page.schema.json", "skills/mistri/SKILL.md"],
              "create-mistri": [...common, "bin.js"],
              "@mistriwork/cloudflare": [...common, "dist/index.js", "dist/index.d.ts"],
              tablewalk: [...common, ...client("tablewalk"), "dist/server/index.js", "app.js", "app.d.ts", "schema/app.schema.json"],
            };
            let failed = false;
            for (const [name, files] of Object.entries(packs)) {
              const missing = (need[name] ?? common).filter(p => !files.includes(p));
              if (missing.length) { console.error(`::error::${name} tarball is missing:`, missing.join(", ")); failed = true; }
              const leak = files.filter(p => /(^|\/)(\.env|credentials\.json|tablewalk\.json)$|(^|\/)\.demo\//.test(p));
              if (leak.length) { console.error(`::error::${name} tarball would ship something private:`, leak.join(", ")); failed = true; }
              console.log(name, files.length, "files");
            }
            const absent = Object.keys(need).filter(name => !packs[name]);
            if (absent.length) { console.error("::error::no tarball for", absent.join(", ")); failed = true; }
            if (failed) process.exit(1);
            console.log("dist present in every package, nothing private");
          '

  # The release does not re-run the suites: it requires that CI already passed
  # on this exact commit. Re-running the same shards on the tag spent another
  # half hour of runners to learn what ci.yml had just said, and a second run
  # could disagree with the first only by flaking, which is not evidence about
  # the code. A tag points at one commit; the CI run for that commit (a push to
  # main, or the pull request's head, which is the same SHA under a
  # fast-forward or a rebased merge) is the record that it was green. The
  # unit suite, the browser suite, the live databases and Web Vitals all gate
  # ci.yml, so there is nothing here that a green run has not already proved.
  # No run, a running one, or a failed one stops the release: re-run CI on the
  # commit, or tag the commit CI ran on.
  ci-green:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    steps:
      - name: CI succeeded on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          runs="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${GITHUB_SHA}&per_page=100" \
            --jq '[.workflow_runs[] | {id, event, status, conclusion}]')"
          echo "$runs"
          ok="$(echo "$runs" | jq '[.[] | select(.status == "completed" and .conclusion == "success")] | length')"
          if [ "$ok" -lt 1 ]; then
            echo "::error::no successful CI run for ${GITHUB_SHA} — let CI pass on this commit (or re-run it), then re-push the tag" >&2
            exit 1
          fi
          echo "CI passed on ${GITHUB_SHA} ($ok run)"

  # The irreversible step, gated on CI having passed this commit.
  npm:
    needs: [ci-green]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for npm trusted publishing over OIDC — this is what lets
      # `npm publish` authenticate without a stored token.
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run build
      # Trusted publishing over OIDC: no token, because `id-token: write` above
      # lets npm authenticate to the registry directly, and no `--provenance`
      # flag, because OIDC generates and publishes the provenance attestation
      # automatically. The one prerequisite is on npm's side — a trusted
      # publisher configured for this package naming this repo and this
      # workflow file (release.yml). Until that exists, this step fails with an
      # auth error rather than publishing — for each of the seven packages (create-mistri
      # and @mistriwork/cloudflare among them: each trusted publisher is configured separately).
      #
      # Every package, in dependency order (npm walks `workspaces` as listed:
      # engine, ui, kit, mistri, create-mistri, cloudflare, tablewalk): a package depends
      # on those before it at exactly this version (tablewalk on engine, kit
      # and ui; create-mistri on mistri), so publishing one alone installs
      # nothing.
      #
      # A prerelease (1.0.0-rc.2) goes out under `next`, never `latest`: npm refuses one without a --tag.
      - run: |
          tag="$(node -p "require('./package.json').version.includes('-') ? 'next' : 'latest'")"
          npm publish --workspaces --access public --tag "$tag"

  # Built and pushed only after npm has published, so the image can never name
  # a version the registry does not have.
  image:
    needs: [npm]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # What lets the workflow push to ghcr.io with the token GitHub already
      # provides. No secret to create, store or rotate.
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # arm64 too (Graviton and Apple silicon hosts). QEMU runs only the
      # runtime stage's few commands; the build stage runs natively (Dockerfile).
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Both tags, deliberately: the version is what someone pins in a compose
      # file and must never move, and `latest` is what someone types by hand —
      # so `latest` only moves for a full release. A pre-release tag (-rc, -beta,
      # anything with a hyphen) ships its version and leaves `latest` where it was.
      - name: Build and push
        run: |
          version="${GITHUB_REF_NAME#v}"
          image="ghcr.io/${{ github.repository_owner }}/tablewalk"
          tags=(-t "$image:$version")
          if [[ "$version" != *-* ]]; then
            tags+=(-t "$image:latest")
          else
            echo "Pre-release $version: latest left where it was."
          fi
          docker buildx build --platform linux/amd64,linux/arm64 \
            --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            --label "org.opencontainers.image.version=$version" \
            --label "org.opencontainers.image.licenses=MIT" \
            "${tags[@]}" --push .
          echo "Pushed $image:$version"
          echo "A new package on ghcr.io starts private — make it public from" \
               "the package page, or a pull fails with 'not found'."
